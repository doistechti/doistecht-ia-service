server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Repassa a API para o gateway: a página e a API ficam na mesma origem, sem CORS.
    # Só /v1 é exposto; o Actuator e o Swagger continuam apenas no serviço.
    location /v1/ {
        proxy_pass http://ia-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streaming (Server-Sent Events): repassa cada trecho assim que chega
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Upload de documentos (o serviço aceita até 10 MB)
        client_max_body_size 12m;
    }
}
