spring:
  application:
    name: ia-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ia_service}
    username: ${DB_USERNAME:ia_service}
    password: ${DB_PASSWORD:ia_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Tempo curto: com o Redis fora do ar, o serviço segue sem cache e sem rate limit
      timeout: 2s
  servlet:
    multipart:
      # Um pouco acima de ia-service.rag.max-document-size, para a mensagem de erro vir do serviço
      max-file-size: 11MB
      max-request-size: 12MB
  mvc:
    async:
      # Tempo máximo de uma resposta em streaming
      request-timeout: 120s
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
    # Desliga o retry interno do Spring AI: novas tentativas ficam só com o Resilience4j
    retry:
      max-attempts: 0

ia-service:
  admin-key: ${IA_SERVICE_ADMIN_KEY}
  gemini:
    timeout: ${GEMINI_TIMEOUT:30s}
    # Modelo reserva, usado quando o principal está fora do ar ou sem cota; vazio desativa
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  rag:
    chunk-size: 1000
    chunk-overlap: 200
    max-document-size: 10MB
    max-chunks: 500
    embedding-batch-size: 50
    embedding-batch-delay: 500ms
    default-top-k: 4
    max-top-k: 20
    min-score: ${RAG_MIN_SCORE:0.5}
    # Precisa ser igual à dimensão da coluna vector(768) criada na migration V4
    embedding-dimensions: 768
  auth:
    key-cache-ttl: 30s
  cache:
    enabled: ${RESPONSE_CACHE_ENABLED:true}
    ttl: ${RESPONSE_CACHE_TTL:1h}
  # Preços em dólares por milhão de tokens (plano pago), usados só para estimar custo
  pricing:
    "[gemini-2.5-flash]":
      input-per-million: 0.30
      output-per-million: 2.50
    "[gemini-2.5-flash-lite]":
      input-per-million: 0.10
      output-per-million: 0.40
    "[gemini-2.5-pro]":
      input-per-million: 1.25
      output-per-million: 10.00

# Padrões aplicados ao retry e ao circuit breaker de cada modelo (ex.: "gemini:gemini-2.5-flash").
# Quais erros contam (só os transitórios) é definido no código, em ModelFallbackExecutor.
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  # Actuator em porta separada: no Docker, só a rede interna (Prometheus) alcança /actuator/prometheus
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ia-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
