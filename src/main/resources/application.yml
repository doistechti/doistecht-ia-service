spring:
  application:
    name: ia-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ia_service}
    username: ${DB_USERNAME:ia_service}
    password: ${DB_PASSWORD:ia_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    async:
      # Tempo máximo de uma resposta em streaming
      request-timeout: 120s
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}

ia-service:
  api-key: ${IA_SERVICE_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
