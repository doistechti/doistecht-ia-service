spring:
  application:
    name: ia-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ia_service}
    username: ${DB_USERNAME:ia_service}
    password: ${DB_PASSWORD:ia_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Tempo curto: com o Redis fora do ar, o serviço segue sem cache e sem rate limit
      timeout: 2s
  mvc:
    async:
      # Tempo máximo de uma resposta em streaming
      request-timeout: 120s
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}

ia-service:
  admin-key: ${IA_SERVICE_ADMIN_KEY}
  auth:
    key-cache-ttl: 30s
  cache:
    enabled: ${RESPONSE_CACHE_ENABLED:true}
    ttl: ${RESPONSE_CACHE_TTL:1h}
  # Preços em dólares por milhão de tokens (plano pago), usados só para estimar custo
  pricing:
    "[gemini-2.5-flash]":
      input-per-million: 0.30
      output-per-million: 2.50
    "[gemini-2.5-flash-lite]":
      input-per-million: 0.10
      output-per-million: 0.40
    "[gemini-2.5-pro]":
      input-per-million: 1.25
      output-per-million: 10.00

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
