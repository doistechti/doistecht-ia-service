services:
  ia-service:
    build: .
    image: doistecht/ia-service:latest
    container_name: ia-service
    ports:
      - "8080:8080"
      # Actuator (health e métricas): publicado só em localhost; o Prometheus usa a rede interna
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ia_service}
      DB_USERNAME: ${DB_USERNAME:-ia_service}
      DB_PASSWORD: ${DB_PASSWORD:-ia_service}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    # PostgreSQL 17 com a extensão pgvector (busca vetorial do RAG)
    image: pgvector/pgvector:0.8.6-pg17
    container_name: ia-service-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ia_service}
      POSTGRES_USER: ${DB_USERNAME:-ia_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ia_service}
    ports:
      # 5433 no host para não conflitar com um PostgreSQL local na 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: ia-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ia-service-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - ia-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.11
    container_name: ia-service-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ia-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Projeto cliente de demonstração: página estática servida pelo nginx, que também repassa
  # /v1 para o gateway (mesma origem, sem precisar de CORS)
  demo:
    image: nginx:1.30.5-alpine
    container_name: ia-service-demo
    ports:
      - "8088:80"
    volumes:
      - ./demo/site:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ia-service
    restart: unless-stopped

  # Provedor local, opcional: suba com o profile "ollama" e OLLAMA_ENABLED=true
  # (ou COMPOSE_PROFILES=ollama no .env)
  ollama:
    image: ollama/ollama:0.34.4
    container_name: ia-service-ollama
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Baixa os modelos na primeira execução (ficam no volume ollama-data) e termina
  ollama-models:
    image: ollama/ollama:0.34.4
    container_name: ia-service-ollama-models
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2:3b} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  ollama-data:
